services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhitu}
      MYSQL_USER: ${MYSQL_USER:-zhitu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhitu123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhitu}
      MYSQL_USER: ${MYSQL_USER:-zhitu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zhitu123}
      REDIS_HOST: redis
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-plus}
      AI_CONNECT_TIMEOUT_MS: ${AI_CONNECT_TIMEOUT_MS:-5000}
      AI_READ_TIMEOUT_MS: ${AI_READ_TIMEOUT_MS:-60000}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1200}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173,https://www.zhituzhipei.cc,https://zhituzhipei.cc}
    ports: ["8080:8080"]
    volumes: [./uploads:/app/uploads]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
  frontend:
    build: frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mysql_data:
